{% extends 'base.html' %}{% block title %}تعديل الحركة{% endblock %}{% block content %}
<div class="toolbar"><div><h1>تعديل الحركة</h1><p class="subtitle">{{m.employee.full_name}} — تعديل مباشر دون اعتماد</p></div><a class="btn secondary" href="/movements">رجوع</a></div>
<div class="box"><form method="post"><input type="hidden" name="_csrf" value="{{csrf}}"><input type="hidden" name="reason" value=""><label>نوع الحركة<select name="movement_type" id="movement_type" required>{% for x in movement_types %}<option value="{{x}}" {% if m.movement_type==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><div class="grid wide"><label>الفرع الأساسي للموظف<input value="{{m.employee.branch.name}}" readonly></label><label data-movement="إجازة" hidden>نوع الإجازة<select name="leave_type" id="leave_type"><option value="">اختر نوع الإجازة</option>{% for x in leave_types %}<option value="{{x}}" {% if m.leave_type==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label data-movement="انتداب" hidden>الفرع المنتدب إليه<select name="destination_branch_id" id="destination_branch_id"><option value="">اختر الفرع</option>{% for b in bs %}<option value="{{b.id}}" {% if m.destination_branch_id==b.id %}selected{% endif %}>{{b.name}}</option>{% endfor %}</select></label><label data-movement="إجازة" data-movement2="انتداب" hidden>من تاريخ<input type="date" name="from_date" id="from_date" value="{{m.from_date or ''}}"></label><label data-movement="إجازة" data-movement2="انتداب" hidden>إلى تاريخ<input type="date" name="to_date" id="to_date" value="{{m.to_date or ''}}"></label><label data-movement="إذن" hidden>تاريخ الإذن<input type="date" name="permission_date" id="permission_date" value="{{m.permission_date or ''}}"></label></div><div class="duration-box"><b>المدة:</b> <span id="movement_days">—</span> يوم</div><div class="form-actions"><button>حفظ التعديل</button></div></form></div>{% endblock %}
