[project]
name = "employee-movements"
description = "نظام إدارة حركات الموظفين — Employee Movements Central"
requires-python = ">=3.12"
version = "61.2.3"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["employee_movements/static"]

[tool.ruff.lint]
select = ["E9", "F"]
ignore = ["F401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
