{% extends 'base.html' %}
{% block title %}تعديل الموظف{% endblock %}
{% block content %}
<div class="toolbar"><div><h1>تعديل الموظف</h1><p class="subtitle">جميع بيانات الموظف إجبارية.</p></div><div><a class="btn secondary" href="/employees">رجوع</a>{% if has_role('مسؤول التطبيق') %} <a class="btn" href="{{url_for('employee_convert_role',i=e.id)}}">تغيير الصفة: موظف / مدخل أول</a>{% endif %}</div></div>
<div class="box"><form method="post" class="grid wide">
<input type="hidden" name="_csrf" value="{{csrf}}">
<label>اسم الموظف<input name="full_name" value="{{e.full_name}}" required></label>
<label>الوظيفة<input name="job_title" value="{{e.job_title or ''}}" required></label>
<label>الكود الوظيفي<input name="job_code" value="{{e.job_code or ''}}" required></label>
<label>المحافظة<select name="governorate_id" id="employee_governorate" required>{% for g in govs %}<option value="{{g.id}}" {% if g.id==e.branch.governorate_id %}selected{% endif %}>{{g.name}}</option>{% endfor %}</select></label>
<label>الفرع<select name="branch_id" id="employee_branch" required>{% for b in bs %}<option value="{{b.id}}" data-governorate="{{b.governorate_id}}" {% if b.id==e.branch_id %}selected{% endif %}>{{b.name}}</option>{% endfor %}</select></label>
<label>تاريخ التعيين<input type="date" name="hire_date" value="{{e.hire_date or ''}}" required></label>
<label>هاتف الشركة<input name="company_phone" value="{{e.company_phone or ''}}" required></label>
<label>الهاتف الشخصي<input name="personal_phone" value="{{e.personal_phone or ''}}" required></label>
<div class="form-actions"><button>حفظ التعديلات</button></div>
</form></div>
{% endblock %}
