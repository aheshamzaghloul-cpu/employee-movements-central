{% extends 'base.html' %}{% block content %}<h1>تعديل المستخدم</h1><div class="box narrow"><form method="post"><input type="hidden" name="_csrf" value="{{csrf}}"><label>الاسم الكامل<input name="full_name" value="{{u.full_name}}" required></label><label>اسم المستخدم<input value="{{u.username}}" disabled></label><label>الأدوار{% for r in ['مسؤول التطبيق','مشرف محافظة','المدخل الأول'] %}<span class="check"><input type="checkbox" name="roles" value="{{r}}" {% if r in user_roles %}checked{% endif %}>{{r}}</span>{% endfor %}</label><button>حفظ التعديل</button></form></div>{% endblock %}
