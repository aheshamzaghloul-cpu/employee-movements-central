{% extends 'base.html' %}{% block content %}<h1>تعديل الحركة</h1><div class="box"><form method="post" class="grid"><input type="hidden" name="_csrf" value="{{csrf}}"><select name="employee_id" disabled><option>{{m.employee.full_name}} — {{m.employee.employee_code}}</option></select><select name="movement_type"><option {% if m.movement_type=='إجازة' %}selected{% endif %}>إجازة</option><option {% if m.movement_type=='انتداب' %}selected{% endif %}>انتداب</option><option {% if m.movement_type=='إذن' %}selected{% endif %}>إذن</option></select><select name="leave_type"><option value="">نوع الإجازة</option>{% for x in leave_types %}<option {% if m.leave_type==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select><select name="destination_branch_id"><option value="">فرع الانتداب إليه</option>{% for b in bs %}<option value="{{b.id}}" {% if b.id==m.destination_branch_id %}selected{% endif %}>{{b.governorate.name}} — {{b.name}}</option>{% endfor %}</select><input type="date" name="from_date" value="{{m.from_date or ''}}"><input type="date" name="to_date" value="{{m.to_date or ''}}"><input type="date" name="permission_date" value="{{m.permission_date or ''}}"><input name="notes" value="{{m.notes or ''}}"><button>حفظ التعديل</button></form></div>{% endblock %}
