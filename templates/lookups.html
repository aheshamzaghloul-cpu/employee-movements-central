{% extends 'base.html' %}{% block content %}<h1>القوائم الأساسية</h1><div class="box"><form method="post" class="grid"><input type="hidden" name="_csrf" value="{{csrf}}"><select name="kind"><option value="leave">نوع إجازة</option><option value="movement">نوع حركة</option></select><input name="name" placeholder="اسم العنصر" required><button>إضافة</button></form></div><div class="box tablewrap"><table><tr><th>القائمة</th><th>العنصر</th><th>الحالة</th><th>إجراءات</th></tr>{% for x in rows %}<tr><td>{{'نوع إجازة' if x.kind=='leave' else 'نوع حركة'}}</td><td><form class="inline" method="post" action="/lookups/{{x.id}}/edit"><input type="hidden" name="_csrf" value="{{csrf}}"><input name="name" value="{{x.name}}" required><button class="mini">حفظ</button></form></td><td>{{'نشط' if x.is_active else 'معطل'}}</td><td><form class="inline" method="post" action="/lookups/{{x.id}}/toggle"><input type="hidden" name="_csrf" value="{{csrf}}"><button class="gray mini">{{'تعطيل' if x.is_active else 'تفعيل'}}</button></form><form class="inline" method="post" action="/lookups/{{x.id}}/delete"><input type="hidden" name="_csrf" value="{{csrf}}"><button class="red mini">حذف</button></form></td></tr>{% else %}<tr><td colspan="4">لا توجد بيانات.</td></tr>{% endfor %}</table></div>{% endblock %}
