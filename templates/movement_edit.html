{% extends 'base.html' %}{% block title %}تعديل الحركة{% endblock %}{% block content %}
<div class="toolbar"><div><h1>تعديل الحركة</h1><p class="subtitle">{{m.employee.full_name}} — تعديل مباشر دون اعتماد</p></div><a class="btn secondary" href="/movements">رجوع</a></div>
<div class="box"><form method="post"><input type="hidden" name="_csrf" value="{{csrf}}"><input type="hidden" name="reason" value=""><label>نوع الحركة<select name="movement_type" id="movement_type" required>{% for x in movement_types %}<option value="{{x}}" {% if m.movement_type==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><div class="grid wide"><label>الفرع الأساسي للموظف<input value="{{m.employee.branch.name}}" readonly></label><label data-movement="إجازة" hidden>نوع الإجازة<select name="leave_type" id="leave_type"><option value="">اختر نوع الإجازة</option>{% for x in leave_types %}<option value="{{x}}" {% if m.leave_type==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label data-movement="انتداب" hidden>الفرع المنتدب إليه<select name="destination_branch_id" id="destination_branch_id"><option value="">اختر الفرع</option>{% for b in bs %}<option value="{{b.id}}" {% if m.destination_branch_id==b.id %}selected{% endif %}>{{b.name}}</option>{% endfor %}</select></label><label data-movement="إجازة" data-movement2="انتداب" hidden>من تاريخ<input type="date" name="from_date" id="from_date" value="{{m.from_date or ''}}"></label><label data-movement="انتداب" hidden id="open_assignment_wrap"><span><input type="checkbox" name="open_assignment" id="open_assignment" value="1" {% if m.movement_type=='انتداب' and m.to_date is none %}checked{% endif %}> انتداب مفتوح — بدون تاريخ نهاية</span></label><label data-movement="إجازة" data-movement2="انتداب" hidden id="to_date_wrap">إلى تاريخ<input type="date" name="to_date" id="to_date" value="{{m.to_date or ''}}"></label><label data-movement="إذن" hidden>تاريخ الإذن<input type="date" name="permission_date" id="permission_date" value="{{m.permission_date or ''}}"></label></div><div class="duration-box"><b>المدة:</b> <span id="movement_days">—</span> يوم</div><div class="form-actions"><button>حفظ التعديل</button></div></form></div><script>(function(){const t=document.getElementById('movement_type'),cb=document.getElementById('open_assignment'),to=document.getElementById('to_date'),ow=document.getElementById('open_assignment_wrap'),tw=document.getElementById('to_date_wrap');function sync(){const a=t&&t.value==='انتداب',o=a&&cb&&cb.checked;if(ow)ow.style.display=a?'':'none';if(tw)tw.style.display=a||t&&t.value==='إجازة'?'':'none';if(to){to.required=t&&t.value==='إجازة'||(a&&!o);if(o)to.value='';}}t&&t.addEventListener('change',sync);cb&&cb.addEventListener('change',sync);sync();})();</script>{% endblock %}
