services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-movements}
      POSTGRES_USER: ${POSTGRES_USER:-movements_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ضع كلمة مرور PostgreSQL في ملف .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-movements_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-movements}
      SECRET_KEY: ${SECRET_KEY:?ضع SECRET_KEY عشوائيًا (32 حرفًا على الأقل) في ملف .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ضع كلمة مرور المسؤول الأولية في ملف .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_TIMEOUT: ${GEMINI_TIMEOUT:-20}
      ASSISTANT_TIMEOUT_SECONDS: ${ASSISTANT_TIMEOUT_SECONDS:-8}
      ASSISTANT_RATE_LIMIT: ${ASSISTANT_RATE_LIMIT:-30}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      REDIS_URL: ${REDIS_URL:-}
      CSP_REPORT_ONLY: ${CSP_REPORT_ONLY:-0}
      SLOW_REQUEST_LOG_MS: ${SLOW_REQUEST_LOG_MS:-1500}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-10}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      DB_INIT_RETRIES: ${DB_INIT_RETRIES:-8}
      DB_INIT_RETRY_DELAY: ${DB_INIT_RETRY_DELAY:-3}
      INIT_DATABASE: ${INIT_DATABASE:-1}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?ضع اسم النطاق في ملف .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
