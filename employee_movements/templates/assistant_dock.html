<aside class="assistant-dock" id="assistantDock" data-open="0" aria-label="مساعد بسيوني الذكي">
  <button class="assistant-dock-trigger" id="assistantDockToggle" type="button" aria-label="فتح مساعد بسيوني الذكي" aria-expanded="false" title="بسيوني في خدمتك">
    <span class="basyouni-mark" aria-hidden="true">ب</span>
    <span class="assistant-dock-copy"><strong>بسيوني</strong><small>في خدمتك</small></span>
    <span class="assistant-dock-presence" aria-hidden="true"></span>
  </button>
  <div class="assistant-dock-panel" id="assistantDockPanel" hidden>
    <div class="assistant-dock-panel-head">
      <div><b>بسيوني في خدمتك</b><small>مساعدك الذكي في كل خطوة داخل النظام</small></div>
      <div class="assistant-dock-panel-actions">
        <span class="assistant-dock-status">متاح</span>
        <button class="assistant-dock-close" id="assistantDockClose" type="button" aria-label="إغلاق المساعد" title="إغلاق المساعد">×</button>
      </div>
    </div>
    <div class="assistant-dock-context" id="assistantDockContext">أنا بسيوني. شايف سياق الصفحة الحالية، وهساعدك فيه من غير ما أتجاوز صلاحياتك.</div>
    <div class="assistant-dock-thread" id="assistantDockThread" aria-live="polite"></div>
    <form class="assistant-dock-composer" id="assistantDockForm" method="post" action="/assistant?panel=1">
      <input type="hidden" name="_csrf" value="{{csrf}}">
      <input type="hidden" name="workspace_context" id="assistantWorkspaceContext" value="">
      <input type="text" name="prompt" id="assistantDockInput" placeholder="اكتب طلبك لبسيوني هنا…" autocomplete="off">
      <button type="submit" class="assistant-dock-send" aria-label="إرسال">إرسال</button>
    </form>
  </div>
</aside>
