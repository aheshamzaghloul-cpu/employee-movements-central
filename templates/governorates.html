{% extends 'base.html' %}{% block content %}<h1>المحافظات</h1><div class="box"><form method="post" class="grid"><input type="hidden" name="_csrf" value="{{csrf}}"><input name="name" placeholder="اسم المحافظة" required><button>إضافة</button></form></div><div class="box tablewrap"><table><tr><th>المحافظة</th><th>الحالة</th><th>تعديل</th><th>حالة</th><th>حذف</th></tr>{% for x in rows %}<tr><td>{{x.name}}</td><td>{{'نشطة' if x.is_active else 'معطلة'}}</td><td><form method="post" action="/governorates/{{x.id}}/edit" class="inline"><input type="hidden" name="_csrf" value="{{csrf}}"><input name="name" value="{{x.name}}" required><button class="mini">حفظ</button></form></td><td><form method="post" action="/governorates/{{x.id}}/toggle"><input type="hidden" name="_csrf" value="{{csrf}}"><button class="gray mini">{{'تعطيل' if x.is_active else 'تفعيل'}}</button></form></td><td><form method="post" action="/governorates/{{x.id}}/delete"><input type="hidden" name="_csrf" value="{{csrf}}"><button class="red mini">حذف</button></form></td></tr>{% else %}<tr><td colspan="5">لا توجد بيانات.</td></tr>{% endfor %}</table></div>{% endblock %}
