{% extends 'base.html' %}{% block title %}محافظة العمل{% endblock %}{% block content %}<div class="page-heading"><div><p class="eyebrow">نطاق الصلاحيات</p><h1>اختر محافظة العمل</h1><p class="muted">لن يتم عرض بيانات تشغيلية قبل اختيار محافظة مسموح بها.</p></div></div><section class="content-card narrow"><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>المحافظة<select name="governorate_id" required><option value="">اختر المحافظة</option>{% for g in governorates %}<option value="{{ g.id }}">{{ g.name }}</option>{% endfor %}</select></label>{% if not governorates %}<p class="muted">لا توجد محافظات ضمن نطاق صلاحياتك حتى الآن. تواصل مع Admin.</p>{% endif %}<button class="primary" {% if not governorates %}disabled{% endif %}>تأكيد الاختيار</button></form></section>{% endblock %}
