{% extends 'base.html' %}
{% block title %}تعديل الموظف{% endblock %}
{% block content %}
<div class="toolbar"><div><h1>تعديل الموظف</h1><p class="subtitle">تعديل بيانات الموظف مع اختيار المحافظة ثم الفرع.</p></div><a class="btn secondary" href="/employees">رجوع</a></div>
<div class="box"><form method="post" class="grid wide">
<input type="hidden" name="_csrf" value="{{csrf}}">
<label>كود الموظف<input name="employee_code" value="{{e.employee_code}}" required></label>
<label>اسم الموظف<input name="full_name" value="{{e.full_name}}" required></label>
<div><label>المحافظة</label><div class="choice-list compact" data-single-choice data-choice-group="governorate_id" data-required="1" data-governorate-choice>
{% for g in govs %}<label class="choice-item"><input type="checkbox" name="governorate_id" value="{{g.id}}" {% if g.id==e.branch.governorate_id %}checked{% endif %}>{{g.name}}</label>{% endfor %}
</div></div>
<div><label>الفرع</label><div class="choice-list compact" data-single-choice data-choice-group="branch_id" data-required="1" data-branch-choice>
{% for b in bs %}<label class="choice-item" data-governorate="{{b.governorate_id}}"><input type="checkbox" name="branch_id" value="{{b.id}}" {% if b.id==e.branch_id %}checked{% endif %}>{{b.governorate.name}} — {{b.name}}</label>{% endfor %}
</div></div>
<label>الوظيفة<input name="job_title" value="{{e.job_title or ''}}"></label>
<label>الكود الوظيفي<input name="job_code" value="{{e.job_code or ''}}"></label>
<label>تاريخ التعيين<input type="date" name="hire_date" value="{{e.hire_date or ''}}"></label>
<label>هاتف الشركة<input name="company_phone" value="{{e.company_phone or ''}}"></label>
<label>الهاتف الشخصي<input name="personal_phone" value="{{e.personal_phone or ''}}"></label>
<button>حفظ التعديلات</button>
</form></div>
{% endblock %}
