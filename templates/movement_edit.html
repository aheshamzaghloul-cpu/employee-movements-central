{% extends 'base.html' %}{% block title %}تعديل الحركة{% endblock %}{% block content %}<div class="toolbar"><div><h1>تعديل الحركة</h1><p class="subtitle">{{m.employee.full_name}} — {{m.employee.employee_code}}</p></div><a class="btn secondary" href="/movements">رجوع</a></div><div class="box"><form method="post"><input type="hidden" name="_csrf" value="{{csrf}}"><div class="movement-typebar"><label><input type="radio" name="movement_type" value="إجازة" {% if m.movement_type=='إجازة' %}checked{% endif %}><span>📅 إجازة</span></label><label><input type="radio" name="movement_type" value="انتداب" {% if m.movement_type=='انتداب' %}checked{% endif %}><span>✈️ انتداب</span></label><label><input type="radio" name="movement_type" value="إذن" {% if m.movement_type=='إذن' %}checked{% endif %}><span>🕐 إذن</span></label></div><div class="grid wide"><label data-movement="إجازة">نوع الإجازة<select name="leave_type" id="leave_type"><option value="">اختر نوع الإجازة</option>{% for x in leave_types %}<option {% if m.leave_type==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label data-movement="انتداب">الفرع المنتدب إليه<select name="destination_branch_id" id="destination_branch_id"><option value="">اختر الفرع</option>{% for b in bs %}<option value="{{b.id}}" {% if b.id==m.destination_branch_id %}selected{% endif %}>{{b.governorate.name}} — {{b.name}}</option>{% endfor %}</select></label><label data-movement="إجازة" data-movement2="انتداب">من تاريخ<input type="date" name="from_date" id="from_date" value="{{m.from_date or ''}}"></label><label data-movement="إجازة" data-movement2="انتداب">إلى تاريخ<input type="date" name="to_date" id="to_date" value="{{m.to_date or ''}}"></label><label data-movement="إذن">تاريخ الإذن<input type="date" name="permission_date" id="permission_date" value="{{m.permission_date or ''}}"></label></div><div class="box" style="background:#f7fafc;margin-top:14px"><b>المدة:</b> <span id="movement_days">—</span> يوم</div><button>حفظ التعديل</button></form></div>{% endblock %}
