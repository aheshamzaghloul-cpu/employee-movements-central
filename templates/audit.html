{% extends 'base.html' %}{% block content %}<h1>سجل العمليات</h1><div class="box tablewrap"><table><tr><th>التاريخ</th><th>المستخدم</th><th>العملية</th><th>الكيان</th><th>التفاصيل</th></tr>{% for x in rows %}<tr><td>{{x.created_at}}</td><td>{{audit_users.get(x.user_id,'-')}}</td><td>{{x.action}}</td><td>{{x.entity or '-'}} #{{x.entity_id or ''}}</td><td>{{x.details or ''}}</td></tr>{% endfor %}</table></div>{% endblock %}
