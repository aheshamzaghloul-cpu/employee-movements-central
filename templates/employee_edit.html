{% extends 'base.html' %}{% block content %}<h1>تعديل الموظف</h1><div class="box"><form method="post" class="grid"><input type="hidden" name="_csrf" value="{{csrf}}"><input name="employee_code" value="{{e.employee_code}}" required><input name="full_name" value="{{e.full_name}}" required><select name="branch_id" required>{% for b in bs %}<option value="{{b.id}}" {% if b.id==e.branch_id %}selected{% endif %}>{{b.governorate.name}} — {{b.name}}</option>{% endfor %}</select><input name="job_title" value="{{e.job_title or ''}}"><input name="job_code" value="{{e.job_code or ''}}"><input type="date" name="hire_date" value="{{e.hire_date or ''}}"><input name="company_phone" value="{{e.company_phone or ''}}"><input name="personal_phone" value="{{e.personal_phone or ''}}"><button>حفظ</button></form></div>{% endblock %}
