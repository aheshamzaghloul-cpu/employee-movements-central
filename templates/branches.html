{% extends 'base.html' %}{% block content %}<h1>الفروع</h1><div class="box"><form method="post" class="grid"><input type="hidden" name="_csrf" value="{{csrf}}"><select name="governorate_id" required><option value="">المحافظة</option>{% for g in gs %}<option value="{{g.id}}">{{g.name}}</option>{% endfor %}</select><input name="name" placeholder="اسم الفرع" required><input name="code" placeholder="كود الفرع"><button>إضافة</button></form></div><div class="box tablewrap"><table><tr><th>الفرع</th><th>المحافظة</th><th>الكود</th><th>الحالة</th><th>إجراءات</th></tr>{% for x in rows %}<tr><td><form method="post" action="/branches/{{x.id}}/edit" class="inline"><input type="hidden" name="_csrf" value="{{csrf}}"><select name="governorate_id">{% for g in gs %}<option value="{{g.id}}" {% if g.id==x.governorate_id %}selected{% endif %}>{{g.name}}</option>{% endfor %}</select><input name="name" value="{{x.name}}" required><input name="code" value="{{x.code or ''}}"><button class="mini">حفظ</button></form></td><td>{{x.governorate.name}}</td><td>{{x.code or '-'}}</td><td>{{'نشط' if x.is_active else 'معطل'}}</td><td><form class="inline" method="post" action="/branches/{{x.id}}/toggle"><input type="hidden" name="_csrf" value="{{csrf}}"><button class="gray mini">تفعيل/تعطيل</button></form><form class="inline" method="post" action="/branches/{{x.id}}/delete"><input type="hidden" name="_csrf" value="{{csrf}}"><button class="red mini">حذف</button></form></td></tr>{% else %}<tr><td colspan="5">لا توجد بيانات.</td></tr>{% endfor %}</table></div>{% endblock %}
