{% extends 'base.html' %}{% block content %}<h1>التقارير</h1><div class="box"><form method="get" class="grid"><select name="status"><option value="">كل الحالات</option>{% for x in statuses %}<option value="{{x}}" {% if status==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select><select name="movement_type"><option value="">كل الحركات</option>{% for x in movement_types %}<option value="{{x}}" {% if movement_type==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select><button>تطبيق</button><a class="btn secondary" href="/reports">مسح</a><a class="btn" href="/reports.csv?status={{status|urlencode}}&movement_type={{movement_type|urlencode}}">تصدير CSV</a></form></div><section class="cards">{% for k,v in summary.items() %}<div class="box stat"><strong>{{v}}</strong><div>{{k}}</div></div>{% endfor %}</section><div class="box tablewrap"><h3>حسب نوع الحركة</h3><table><tr><th>النوع</th><th>العدد</th></tr>{% for k,v in by_type.items() %}<tr><td>{{k}}</td><td>{{v}}</td></tr>{% endfor %}</table></div>{% endblock %}
