{% extends 'base.html' %}
{% block title %}مراجعة طلب تعديل مأمورية{% endblock %}
{% block content %}<div class="ui-page-head"><div><span class="home-kicker">طلب تعديل</span><h1>تعديل المأمورية #{{m.id}}</h1><p class="ui-muted">طلب من: <b>{{request_row.requester.full_name}}</b> — السبب: {{request_row.reason}}</p></div></div><div class="ui-card ui-pad-18"><p><b>البيانات قبل التعديل:</b> {{request_row.details_snapshot}}</p></div><div class="ui-card ui-mission-edit-card"><form method="post" class="ui-grid ui-grid-3-gap-16"><input type="hidden" name="_csrf" value="{{csrf}}"><div class="ui-grid-full"><label>الموظف</label><input value="{{m.employee.full_name}} — {{m.employee.job_code or '—'}}" disabled></div><div><label>محافظة جهة المأمورية</label><select id="requestDestinationGovernorate" required><option value="">اختر المحافظة</option>{% for g in destination_governorates %}<option value="{{g.id}}" {% if m.destination and m.destination.governorate_id==g.id %}selected{% endif %}>{{g.name}}</option>{% endfor %}</select></div><div><label>فرع جهة المأمورية</label><select name="destination_branch_id" id="requestDestinationBranch" required><option value="">اختر الفرع</option>{% for b in branches %}<option value="{{b.id}}" data-governorate-id="{{b.governorate_id}}" {% if m.destination_branch_id==b.id %}selected{% endif %}>{{b.name}}</option>{% endfor %}</select></div><div><label>من تاريخ</label><input type="date" name="from_date" value="{{m.from_date.isoformat() if m.from_date else ''}}" required></div><div><label>إلى تاريخ</label><input type="date" name="to_date" value="{{m.to_date.isoformat() if m.to_date else ''}}"></div><div><label>الحالة بعد الحفظ</label><select name="final_state" required><option value="مغلقة">حفظ مغلقة</option><option value="تحت التحرير">حفظ تحت التحرير</option></select></div><div class="ui-grid-full"><label>ملاحظات الـManager</label><textarea name="manager_notes" rows="4"></textarea></div><div class="ui-actions ui-grid-full"><button class="ui-btn ui-tone-teal">تنفيذ وحفظ</button><a class="ui-btn ui-btn-secondary" href="/reports/assignments/edit-requests">إلغاء</a></div><script>(function(){const g=document.getElementById('requestDestinationGovernorate'),b=document.getElementById('requestDestinationBranch');if(!g||!b)return;const all=[...b.options].slice(1).map(o=>({value:o.value,text:o.textContent,gov:o.dataset.governorateId}));function sync(){const selected=b.value,gid=g.value;b.innerHTML='<option value="">اختر الفرع</option>';all.filter(x=>x.gov===gid).forEach(x=>{const o=document.createElement('option');o.value=x.value;o.textContent=x.text;if(x.value===selected)o.selected=true;b.appendChild(o);});b.disabled=!gid;}g.addEventListener('change',sync);sync();})();</script></form></div>{% endblock %}
