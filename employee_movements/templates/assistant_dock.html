<aside class="assistant-dock" id="assistantDock" data-open="0" aria-label="بسيوني في الخدمة">
  <button class="assistant-dock-trigger" id="assistantDockToggle" type="button" aria-label="فتح بسيوني في الخدمة" aria-expanded="false" title="بسيوني في الخدمة">
    <span class="basyouni-mark" aria-hidden="true">ب</span>
  </button>
  <div class="assistant-dock-panel" id="assistantDockPanel" hidden>
    <div class="assistant-dock-panel-head">
      <div><b>بسيوني في الخدمة</b><small>معاك في أي مكان داخل النظام</small></div>
      <span class="assistant-dock-status">متاح</span>
    </div>
    <div class="assistant-dock-context" id="assistantDockContext">أنا بسيوني. الصفحة الحالية تساعدني أفهم السياق، لكنها مش بتقيدني.</div>
    <div class="assistant-dock-thread" id="assistantDockThread" aria-live="polite"></div>
    <form class="assistant-dock-composer" id="assistantDockForm" method="post" action="/assistant?panel=1">
      <input type="hidden" name="_csrf" value="{{csrf}}">
      <input type="hidden" name="workspace_context" id="assistantWorkspaceContext" value="">
      <input type="text" name="prompt" id="assistantDockInput" placeholder="قول لبسيوني عايز تعمل إيه…" autocomplete="off">
      <button type="submit" class="assistant-dock-send" aria-label="إرسال">إرسال</button>
    </form>
  </div>
</aside>
