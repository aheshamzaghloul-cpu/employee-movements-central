{% extends 'base.html' %}{% block title %}تعديل الحركة{% endblock %}{% block content %}
<div class="ui-toolbar ui-movement-form-head"><div><h1>تعديل الحركة</h1><p class="ui-subtitle">{{m.employee.full_name}} — تعديل مباشر دون اعتماد</p></div><a class="ui-btn ui-btn-secondary" href="/movements">رجوع</a></div>
<div class="ui-module-card ui-movement-form-card"><form method="post" class="ui-movement-form"><input type="hidden" name="_csrf" value="{{csrf}}"><input type="hidden" name="reason" value=""><div class="workflow-form-section workflow-form-section-primary"><div class="workflow-form-section-head"><span>01</span><strong>نوع الحركة</strong></div><label class="ui-movement-type-field">نوع الحركة<select name="movement_type" id="movement_type" required>{% for x in movement_types %}<option value="{{x}}" {% if m.movement_type==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label></div><div class="workflow-form-section"><div class="workflow-form-section-head"><span>02</span><strong>تفاصيل الحركة</strong></div><div class="ui-form-grid-movement ui-grid wide"><label>الفرع الأساسي للموظف<input value="{{m.employee.branch.name}}" readonly></label><label data-movement="إجازة" hidden>نوع الإجازة<select name="leave_type" id="leave_type"><option value="">اختر نوع الإجازة</option>{% for x in leave_types %}<option value="{{x}}" {% if m.leave_type==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label data-movement="انتداب" hidden>محافظة جهة المأمورية<select id="destination_governorate_id"><option value="">اختر المحافظة</option>{% for g in destination_governorates %}<option value="{{g.id}}" {% if m.destination_branch and m.destination_branch.governorate_id==g.id %}selected{% endif %}>{{g.name}}</option>{% endfor %}</select></label><label data-movement="انتداب" hidden>الفرع المنتدب إليه<select name="destination_branch_id" id="destination_branch_id" required><option value="">اختر الفرع</option>{% for b in destination_branches %}<option value="{{b.id}}" data-governorate-id="{{b.governorate_id}}" {% if m.destination_branch_id==b.id %}selected{% endif %}>{{b.name}}</option>{% endfor %}</select></label><label data-movement="إجازة" data-movement2="انتداب" hidden>من تاريخ<input type="date" name="from_date" id="from_date" value="{{m.from_date or ''}}"></label><label data-movement="انتداب" hidden id="open_assignment_wrap"><span><input type="checkbox" name="open_assignment" id="open_assignment" value="1" {% if m.movement_type=='انتداب' and m.to_date is none %}checked{% endif %}> انتداب مفتوح — بدون تاريخ نهاية</span></label><label data-movement="إجازة" data-movement2="انتداب" hidden id="to_date_wrap">إلى تاريخ<input type="date" name="to_date" id="to_date" value="{{m.to_date or ''}}"></label><label data-movement="إذن" hidden>تاريخ الإذن<input type="date" name="permission_date" id="permission_date" value="{{m.permission_date or ''}}"></label></div></div><div class="workflow-form-summary"><b>المدة</b><span class="ui-movement-duration duration-box"><span id="movement_days">—</span> يوم</span></div><div class="ui-movement-duration duration-box" hidden><b>المدة:</b> </div><div class="ui-form-actions ui-movement-form-actions"><button class="ui-btn ui-btn-primary">حفظ التعديل</button></div></form></div><script>(function(){const t=document.getElementById('movement_type'),cb=document.getElementById('open_assignment'),to=document.getElementById('to_date'),ow=document.getElementById('open_assignment_wrap'),tw=document.getElementById('to_date_wrap'),gov=document.getElementById('destination_governorate_id'),branch=document.getElementById('destination_branch_id');const allBranches=branch?[...branch.options].slice(1).map(o=>({value:o.value,text:o.textContent,gov:o.dataset.governorateId})):[];function syncDestination(){if(!branch||!gov)return;const selected=branch.value, gid=gov.value;branch.innerHTML='<option value="">اختر الفرع</option>';allBranches.filter(x=>!gid||x.gov===gid).forEach(x=>{const o=document.createElement('option');o.value=x.value;o.textContent=x.text;if(x.value===selected)o.selected=true;branch.appendChild(o);});if(selected&&!allBranches.some(x=>x.value===selected&&(!gid||x.gov===gid)))branch.value='';}function sync(){const a=t&&t.value==='انتداب',o=a&&cb&&cb.checked;if(ow)ow.style.display=a?'':'none';if(tw)tw.style.display=a||t&&t.value==='إجازة'?'':'none';if(gov)gov.parentElement.hidden=!a;if(branch)branch.parentElement.hidden=!a;if(to){to.required=t&&t.value==='إجازة'||(a&&!o);if(o)to.value='';}}t&&t.addEventListener('change',sync);cb&&cb.addEventListener('change',sync);gov&&gov.addEventListener('change',syncDestination);syncDestination();sync();})();</script>{% endblock %}
