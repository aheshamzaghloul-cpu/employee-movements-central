{% extends 'base.html' %}{% block content %}<h1>الموظفون</h1><div class="box"><form method="post" class="grid"><input type="hidden" name="_csrf" value="{{csrf}}"><input name="employee_code" placeholder="كود الموظف" required><input name="full_name" placeholder="اسم الموظف" required><select name="branch_id" required><option value="">الفرع</option>{% for b in bs %}<option value="{{b.id}}">{{b.governorate.name}} — {{b.name}}</option>{% endfor %}</select><input name="job_title" placeholder="الوظيفة"><input name="job_code" placeholder="الكود الوظيفي"><input type="date" name="hire_date"><input name="company_phone" placeholder="هاتف الشركة"><input name="personal_phone" placeholder="الهاتف الشخصي"><button>إضافة موظف</button></form></div><div class="box tablewrap"><table><tr><th>الكود</th><th>الاسم</th><th>الفرع</th><th>إجراءات</th></tr>{% for e in rows %}<tr><td>{{e.employee_code}}</td><td><a href="/employee/{{e.id}}">{{e.full_name}}</a></td><td>{{e.branch.name}}</td><td><a class="btn secondary" href="/employees/{{e.id}}/edit">تعديل</a><form class="inline" method="post" action="/employees/{{e.id}}/toggle"><input type="hidden" name="_csrf" value="{{csrf}}"><button class="gray mini">تعطيل/تفعيل</button></form><form class="inline" method="post" action="/employees/{{e.id}}/delete"><input type="hidden" name="_csrf" value="{{csrf}}"><button class="red mini">حذف</button></form></td></tr>{% else %}<tr><td colspan="4">لا توجد بيانات.</td></tr>{% endfor %}</table></div>{% endblock %}
